[package]
name = "do-html-editable-cli"
version = "0.1.1"
edition = "2021"
description = "A lightweight, standalone CLI that transforms static HTML files into visually editable browser documents with zero server overhead."
license = "MIT OR Apache-2.0"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
kuchikiki = "0.8.2"
opener = "0.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
