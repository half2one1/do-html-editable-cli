<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Quarterly Business Executive Summary</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      padding: 40px;
      line-height: 1.6;
    }
    .card {
      max-width: 720px;
      margin: 0 auto;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-top: 0;
    }
    p {
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Quarterly Business Executive Summary</h1>
    <p>This report highlights the key growth initiatives and quarterly milestones achieved across the engineering and product teams.</p>
    <ul>
      <li>Revenue increased by <strong>34%</strong> YoY</li>
      <li>Customer retention rate reached <strong>98.2%</strong></li>
      <li>Cloud infrastructure costs reduced by <strong>18%</strong></li>
    </ul>
  </div>
</body>
</html>
